<p id="pwa-status" class="card muted hidden" role="status" style="max-width:876px;margin:12px auto"></p>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  let deferredPrompt = null, waitingWorker = null, installed = false;
  const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const banner = $('install-banner');
  const installButton = $('installNow');
  const menuButton = $('installMenu');
  const status = $('pwa-status');
  function message(text) {
    status.textContent = text;
    status.classList.remove('hidden');
  }
  function updateUI() {
    if (installed || standalone()) {
      banner.classList.add('hidden');
      menuButton.textContent = '✓ Aplicativo instalado';
      return;
    }
    menuButton.textContent = deferredPrompt ? '↓ Instalar aplicativo' : '↓ Instalação do aplicativo';
    if (deferredPrompt) banner.classList.remove('hidden');
  }
  // Instalação independente da abertura do banco local.
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredPrompt = event;
    installButton.disabled = false;
    updateUI();
  });
  window.addEventListener('appinstalled', () => {
    installed = true;
    deferredPrompt = null;
    updateUI();
    message('Instalação confirmada pelo navegador. Procure Minha Escala nos aplicativos.');
  });
  async function install() {
    if (installed || standalone()) {
      message('Minha Escala já está instalada ou aberta como aplicativo.');
      return;
    }
    if (!deferredPrompt) {
      message('O navegador ainda não liberou a instalação. Abra este endereço diretamente no Chrome, use o aplicativo por alguns instantes e verifique o menu ⋮. Se aparecer “já instalado”, procure Minha Escala em Configurações → Aplicativos.');
      return;
    }
    const prompt = deferredPrompt;
    deferredPrompt = null;
    installButton.disabled = true;
    try {
      await prompt.prompt();
      const choice = await prompt.userChoice;
      if (!installed) message(choice.outcome === 'accepted'
        ? 'Solicitação aceita. Aguarde a conclusão da instalação pelo navegador.'
        : 'Instalação cancelada. Você pode tentar novamente pelo menu do navegador.');
    } catch (error) {
      console.error('Falha no convite de instalação:', error);
      message('Não foi possível abrir o convite de instalação. Tente pelo menu ⋮ do Chrome.');
    } finally {
      banner.classList.add('hidden');
      installButton.disabled = false;
      updateUI();
    }
  }
  installButton.onclick = install;
  menuButton.onclick = () => { $('sidebar').classList.add('hidden'); install(); };
  $('installDismiss').onclick = () => banner.classList.add('hidden');
  matchMedia('(display-mode: standalone)').addEventListener('change', updateUI);
  updateUI();
  if (!('serviceWorker' in navigator) || !window.isSecureContext) {
    message('Para instalar, abra o aplicativo por HTTPS no Chrome.');
    return;
  }
  let hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // Não interromper um convite de instalação na primeira ativação.
    if (hadController && !reloading) { reloading = true; location.reload(); }
    hadController = true;
  });
  $('updateNow').onclick = () => {
    if (waitingWorker) waitingWorker.postMessage({type:'skipWaiting'});
  };
  navigator.serviceWorker.register('./sw.js', {scope:'./', updateViaCache:'none'}).then(reg => {
    const showUpdate = () => {
      waitingWorker = reg.waiting;
      if (waitingWorker && navigator.serviceWorker.controller) {
        banner.classList.add('hidden');
        $('update-toast').classList.remove('hidden');
      }
    };
    const watch = worker => {
      if (!worker) return;
      worker.addEventListener('statechange', () => {
        if (worker.state === 'installed') showUpdate();
        if (worker.state === 'redundant') message('A atualização do aplicativo não foi concluída. Confira se todos os arquivos do pacote foram publicados e recarregue a página.');
      });
    };
    showUpdate(); watch(reg.installing);
    reg.addEventListener('updatefound', () => watch(reg.installing));
  }).catch(error => {
    console.error('Falha no Service Worker:', error);
    message('Não foi possível preparar a instalação. Confira a publicação do sw.js e dos ícones e recarregue o site.');
  });
})();

</script>

function renderYear(){let y=view.getFullYear();let html='';for(let m=0;m<12;m++){const offset=new Date(y,m,1).getDay(),total=new Date(y,m+1,0).getDate();let cells=Array(offset).fill('<span class="miniday blank"></span>').join('');for(let d=1;d<=total;d++){const s=status(localISO(new Date(y,m,d)));cells+=`<span class="miniday ${s.type||''}">${d}</span>`}html+=`<div class="mini" data-month="${m}"><h3>${new Date(y,m,1).toLocaleDateString('pt-BR',{month:'long'})}</h3><div class="minidays">${cells}</div></div>`}$('main').innerHTML=`<div class="toolbar"><button class="iconbtn" id="prev">‹</button><h2>${y}</h2><button class="iconbtn" id="next">›</button></div><div class="yeargrid">${html}</div><p class="muted">Toque em um mês para abrir o calendário detalhado.</p>`;$('prev').onclick=()=>{view=new Date(y-1,0,1);render()};$('next').onclick=()=>{view=new Date(y+1,0,1);render()};document.querySelectorAll('[data-month]').forEach(el=>el.onclick=()=>{view=new Date(y,+el.dataset.month,1);page='month';render()})}
function renderScales(){$('main').innerHTML=`<div class="toolbar"><h2>Modelos de escala</h2><button class="btn" id="newScale">+ Criar</button></div><p class="muted">Sequência T = trabalho, F = folga. Ex.: 12x36 = TF; 6x2 = TTTTTTFF.</p><div class="card">${data.scales.length?data.scales.map(s=>`<div class="listitem"><div><strong>${esc(s.name)}</strong><small>${esc(s.description||'')} • ${esc(s.pattern)} • ${esc(s.startTime||'')}–${esc(s.endTime||'')}</small></div><button class="btn secondary" data-scale="${s.id}">Editar</button></div>`).join(''):'Nenhuma escala cadastrada.'}</div><div class="toolbar"><h2>Períodos de aplicação</h2><button class="btn" id="newPeriod">+ Aplicar escala</button></div><p class="muted">Cada período possui data inicial e, opcionalmente, final. O início é a referência do primeiro dia do ciclo.</p><div class="card">${data.periods.length?data.periods.slice().sort((a,b)=>b.start.localeCompare(a.start)).map(p=>`<div class="listitem"><div><strong>${esc(data.scales.find(s=>s.id===p.scaleId)?.name||'Escala excluída')}</strong><small>${esc(p.start)} até ${esc(p.end||'indefinido')} • Referência: ${esc(p.anchor||p.start)}</small></div><button class="btn secondary" data-period="${p.id}">Editar</button></div>`).join(''):'Nenhum período cadastrado.'}</div>`;$('newScale').onclick=()=>scaleModal();$('newPeriod').onclick=()=>periodModal();document.querySelectorAll('[data-scale]').forEach(el=>el.onclick=()=>scaleModal(data.scales.find(s=>s.id===el.dataset.scale)));document.querySelectorAll('[data-period]').forEach(el=>el.onclick=()=>periodModal(data.periods.find(p=>p.id===el.dataset.period)))}
function renderEvents(){$('main').innerHTML=`<div class="actions"><button class="btn" id="newEx">+ Folga / ocorrência</button><button class="btn secondary" id="newEv">+ Nota</button></div><h2 class="sectiontitle">Folgas e alterações</h2><div class="card">${data.exceptions.length?data.exceptions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="listitem"><div><strong>${esc(x.label||x.type)}</strong><small>${esc(x.date)}</small></div><button class="btn secondary" data-ex="${x.id}">Editar</button></div>`).join(''):'Nenhuma ocorrência.'}</div><h2 class="sectiontitle">Notas e eventos</h2><div class="card">${data.events.length?data.events.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="listitem"><div><strong>${esc(x.title)}</strong><small>${esc(x.date)} • ${esc(x.notes||'')}</small></div><button class="btn secondary" data-ev="${x.id}">Editar</button></div>`).join(''):'Nenhuma nota.'}</div>`;$('newEx').onclick=()=>exceptionModal();$('newEv').onclick=()=>eventModal();document.querySelectorAll('[data-ex]').forEach(el=>el.onclick=()=>exceptionModal(data.exceptions.find(x=>x.id===el.dataset.ex)));document.querySelectorAll('[data-ev]').forEach(el=>el.onclick=()=>eventModal(data.events.find(x=>x.id===el.dataset.ev)))}
function renderSettings(){$('main').innerHTML=`<div class="card"><h2>Aparência</h2><div class="field"><label>Tema</label><select id="prefTheme"><option value="dark">Escuro</option><option value="light">Claro</option><option value="auto">Automático</option></select></div><div class="grid2"><div class="field"><label>Trabalho</label><input id="prefWork" type="color"></div><div class="field"><label>Folga</label><input id="prefOff" type="color"></div><div class="field"><label>Folga extra / ocorrência</label><input id="prefExtra" type="color"></div></div><button class="btn" id="saveSettings">Salvar preferências</button></div><div class="card"><h2>Backup</h2><p class="muted">Exporte seus dados em JSON ou importe um backup. A importação mescla documentos com o mesmo ID.</p><div class="actions"><button class="btn secondary" id="exportBackup">Exportar JSON</button><label class="btn secondary" for="importBackup">Importar JSON</label><input type="file" id="importBackup" accept="application/json,.json" class="hidden"></div></div><div class="card"><h2>Armazenamento local</h2><p class="muted">As informações ficam salvas apenas neste navegador e dispositivo. Exporte um backup antes de limpar os dados do navegador ou trocar de celular.</p></div>`;$('prefTheme').value=prefs.theme;$('prefWork').value=prefs.workColor;$('prefOff').value=prefs.offColor;$('prefExtra').value=prefs.extraColor;$('saveSettings').onclick=async()=>{prefs={theme:$('prefTheme').value,workColor:$('prefWork').value,offColor:$('prefOff').value,extraColor:$('prefExtra').value};await savePrefs()};$('exportBackup').onclick=()=>{const blob=new Blob([JSON.stringify({app:'minha-escala',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`minha-escala-${today}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importBackup').onchange=importBackup}
async function savePrefs(){try{await setDoc(record('preferences','visual'),prefs);applyTheme();render();notify('Preferências salvas')}catch(e){notify('Erro ao salvar: '+e.message)}}function modal(title,body,onSave,onDelete){$('modalroot').innerHTML=`<div class="modalback"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>${esc(title)}</h2><button class="iconbtn" id="modalClose" aria-label="Fechar">×</button></div><form id="modalForm">${body}<div class="actions" style="margin-top:20px"><button class="btn" type="submit">Salvar</button><button class="btn secondary" type="button" id="modalCancel">Cancelar</button>${onDelete?'<button class="btn danger" type="button" id="modalDelete">Excluir</button>':''}</div></form></div></div>`;const close=()=>$('modalroot').innerHTML='';$('modalClose').onclick=close;$('modalCancel').onclick=close;$('modalForm').onsubmit=async e=>{e.preventDefault();try{await onSave();close();notify('Salvo com sucesso')}catch(err){notify(err.message)}};if(onDelete)$('modalDelete').onclick=async()=>{if(confirm('Confirma a exclusão?'))try{await onDelete();close();notify('Excluído')}catch(e){notify(e.message)}}}
const field=(label,id,value='',type='text',required=true)=>`<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="${type}" value="${esc(value)}" ${required?'required':''}></div>`;function scaleModal(s){modal(s?'Editar escala':'Nova escala',field('Nome','fName',s?.name||'')+field('Descrição','fDesc',s?.description||'', 'text',false)+field('Sequência (T = trabalho, F = folga)','fPattern',s?.pattern||'TF')+`<div class="grid2">${field('Entrada','fStart',s?.startTime||'07:00','time')}${field('Saída','fEnd',s?.endTime||'19:00','time')}</div>`+field('Identificação do turno','fLabel',s?.workLabel||'Trabalho'),async()=>{const pattern=$('fPattern').value.trim().toUpperCase().replace(/\s/g,'');if(!/^[TF]{1,366}$/.test(pattern))throw Error('A sequência deve conter apenas T e F (até 366 dias).');const payload={name:$('fName').value.trim(),description:$('fDesc').value.trim(),pattern,startTime:$('fStart').value,endTime:$('fEnd').value,workLabel:$('fLabel').value.trim()};if(s)await updateDoc(record('scales',s.id),payload);else await addDoc(path('scales'),payload)},s?async()=>{if(data.periods.some(p=>p.scaleId===s.id))throw Error('Remova os períodos vinculados antes de excluir a escala.');await deleteDoc(record('scales',s.id))}:null)}function periodModal(p){if(!data.scales.length)return notify('Crie uma escala primeiro.');const options=data.scales.map(s=>`<option value="${s.id}" ${p?.scaleId===s.id?'selected':''}>${esc(s.name)}</option>`).join('');modal(p?'Editar período':'Aplicar escala',`<div class="field"><label>Escala</label><select id="fScale">${options}</select></div>`+field('Data de início','fFrom',p?.start||today,'date')+field('Data final (opcional)','fTo',p?.end||'','date',false)+field('Data de referência do ciclo','fAnchor',p?.anchor||p?.start||today,'date')+`<p class="muted">Na data de referência, começa o primeiro símbolo da sequência. Para inverter os dias da escala 12x36, ajuste essa referência em um dia.</p>`,async()=>{const payload={scaleId:$('fScale').value,start:$('fFrom').value,end:$('fTo').value,anchor:$('fAnchor').value};if(payload.end&&payload.end<payload.start)throw Error('A data final deve ser posterior à inicial.');const overlap=data.periods.some(x=>x.id!==p?.id&&payload.start<=(x.end||'9999-12-31')&&(payload.end||'9999-12-31')>=x.start);if(overlap)throw Error('Este período se sobrepõe a outro. Encerre o anterior antes de criar o novo.');if(p)await updateDoc(record('periods',p.id),payload);else await addDoc(path('periods'),payload)},p?()=>deleteDoc(record('periods',p.id)):null)}function exceptionModal(x,date=selected){modal(x?'Editar ocorrência':'Nova ocorrência',field('Data','fDate',x?.date||date,'date')+`<div class="field"><label>Tipo</label><select id="fType"><option value="extra">Folga extra / banco de horas / férias</option><option value="work">Trabalho extra / troca de turno</option></select></div>`+field('Descrição','fLabel',x?.label||'Folga extra')+`<p class="muted">Esta alteração afeta somente o dia escolhido, sem deslocar o ciclo da escala.</p>`,async()=>{const payload={date:$('fDate').value,type:$('fType').value,label:$('fLabel').value.trim()};const duplicate=data.exceptions.find(e=>e.date===payload.date&&e.id!==x?.id);if(duplicate)throw Error('Já existe uma ocorrência nesse dia. Edite a ocorrência existente.');if(x)await updateDoc(record('exceptions',x.id),payload);else await addDoc(path('exceptions'),payload)},x?()=>deleteDoc(record('exceptions',x.id)):null);$('fType').value=x?.type||'extra'}function eventModal(x,date=selected){modal(x?'Editar nota':'Nova nota',field('Data','fDate',x?.date||date,'date')+field('Título','fTitle',x?.title||'')+`<div class="field"><label>Observações</label><textarea id="fNotes" rows="4">${esc(x?.notes||'')}</textarea></div>`,async()=>{const payload={date:$('fDate').value,title:$('fTitle').value.trim(),notes:$('fNotes').value.trim()};if(x)await updateDoc(record('events',x.id),payload);else await addDoc(path('events'),payload)},x?()=>deleteDoc(record('events',x.id)):null)}
async function importBackup(e){
 const file=e.target.files[0];if(!file)return;
 try{
  if(file.size>3e6)throw Error('Arquivo muito grande.');
  const obj=JSON.parse(await file.text());
  if(obj.app!=='minha-escala'||obj.version!==1||!obj.data)throw Error('Formato de backup inválido.');
  const ops=[];
  for(const kind of STORE_NAMES){
   if(!Array.isArray(obj.data[kind]))throw Error('Dados inválidos: '+kind);
   for(const item of obj.data[kind]){
    if(!item||typeof item.id!=='string'||! /^[A-Za-z0-9_-]{1,200}$/.test(item.id))throw Error('ID inválido no backup.');
    const {id,...payload}=item;
    const str=(key,max=10000)=>typeof payload[key]==='string'&&payload[key].length<=max;
    const date=key=>str(key,10)&&/^\d{4}-\d{2}-\d{2}$/.test(payload[key]);
    if(kind==='scales'&&!(str('name',200)&&str('pattern',366)&&/^[TF]+$/.test(payload.pattern)))throw Error('Escala inválida no backup.');
    if(kind==='periods'&&!(str('scaleId',200)&&date('start')&&(!payload.end||date('end'))&&(!payload.anchor||date('anchor'))))throw Error('Período inválido no backup.');
    if(kind==='exceptions'&&!(date('date')&&str('label')&&['work','extra'].includes(payload.type)))throw Error('Ocorrência inválida no backup.');
    if(kind==='events'&&!(date('date')&&str('title')&&str('notes')))throw Error('Nota inválida no backup.');
    if(kind==='preferences'&&!(id==='visual'&&['dark','light','auto'].includes(payload.theme)&&['workColor','offColor','extraColor'].every(k=>str(k,7)&&/^#[a-fA-F0-9]{6}$/.test(payload[k]))))throw Error('Preferências inválidas no backup.');
    ops.push({type:'set',ref:record(kind,id),payload});
   }
  }
  if(ops.length>2000)throw Error('Backup excede o limite de 2000 registros.');
  if(!confirm(`Importar ${ops.length} registros neste dispositivo? IDs iguais serão substituídos.`))return;
  await commitLocal(ops);notify('Backup importado com sucesso');
 }catch(error){notify('Erro na importação: '+error.message);}
 e.target.value='';
}
render();connect();$('closeNav').onclick=()=>$('sidebar').classList.add('hidden');$('sidebar').onclick=e=>{if(e.target===$('sidebar'))$('sidebar').classList.add('hidden')};document.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>{page=el.dataset.page;$('sidebar').classList.add('hidden');render()});
</script></body></html>
